kind = "web"
previewPath = "/"
title = "Deployment Dashboard"
version = "1.0.0"
id = "artifacts/deployment-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24215

[services.development]
run = "pnpm --filter @workspace/deployment-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deployment-dashboard", "run", "build" ]
publicDir = "artifacts/deployment-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24215"
BASE_PATH = "/"
